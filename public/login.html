<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <!-- Admin Login Modal -->
    <div class="modal fade show" id="adminLoginModal" tabindex="-1" role="dialog" aria-labelledby="adminLoginModalLabel"
        aria-hidden="true" style="display: block; background: rgba(0, 0, 0, 0.5);">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adminLoginModalLabel">Admin Login</h5>
                </div>
                <div class="modal-body">
                    <form id="adminLoginForm" class="needs-validation" novalidate>
                        <div class="form-group">
                            <label for="adminUsername">Username</label>
                            <input type="text" class="form-control" id="adminUsername" placeholder="Enter username"
                                required>
                            <div class="invalid-feedback">Please enter your username.</div>
                        </div>
                        <div class="form-group">
                            <label for="adminPassword">Password</label>
                            <input type="password" class="form-control" id="adminPassword" placeholder="Enter password"
                                required>
                            <div class="invalid-feedback">Please enter your password.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            var username = document.getElementById('adminUsername').value.trim();
            var password = document.getElementById('adminPassword').value.trim();

            if (!username || !password) {
                Swal.fire({
                    icon: 'error',
                    title: 'Login Failed',
                    text: 'Please enter both username and password!'
                });
                return;
            }

            try {
                let response = await fetch('https://nti-tech-website.onrender.com/api/Admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                let data = await response.json();

                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Successful',
                        text: 'Redirecting to Dashboard...',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = 'https://nti-tech-website.onrender.com/dashborad.html';
                    });
                } else {
                    throw new Error(data.message || "Invalid credentials!");
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Login Failed',
                    text: error.message || "An error occurred, please try again."
                });
            }
        });
    </script>

</body>

</html>
